name: Checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/frontend/package-lock.json
      - run: python -m pip install -r divannie-analytiki/requirements-local.txt
      - run: python scripts/check_backend.py
      - run: npm ci
        working-directory: front/frontend
      - run: npm run build
        working-directory: front/frontend
      - run: npm test
        working-directory: front/frontend
